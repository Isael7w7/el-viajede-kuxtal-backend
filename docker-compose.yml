version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: kuxtal_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: kuxtal_db
      MYSQL_USER: kuxtal_user
      MYSQL_PASSWORD: kuxtal_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
